<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="O Falkron ainda está em desenvolvimento. Enquanto isso, jogue //Scape Protocol."
    />
    <title>Falkron — Em breve</title>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__container">
        <img class="site-header__logo" src="./imagens/Logo.png" alt="Falkron" />
      </div>
    </header>

    <main class="main-content">
      <section class="intro-section">
        <h1 class="intro-section__title">
          O FALKRON AINDA ESTÁ EM
          <span class="intro-section__title-highlight">DESENVOLVIMENTO</span>.
        </h1>
        <p class="intro-section__description">
          Estamos construindo uma plataforma para ajudar você a descobrir seu
          próximo jogo favorito.
        </p>
        <p class="intro-section__cta">Enquanto isso, teste seus reflexos em</p>
        <h2 class="intro-section__game-name">//SCAPE PROTOCOL</h2>
      </section>

      <section class="initial-instructions">
        <h3 class="initial-instructions__text">
          PRESSIONE QUALQUER TECLA PARA INICIAR
        </h3>
      </section>
    </main>

    <footer class="footer">
      <img
        class="site-footer__character"
        src="./imagens/Falkron Waiting.png"
        alt="Personagem do jogo em pose inicial"
      />
      <img
        class="site-footer__ground"
        src="./imagens/Ground.png"
        alt="Chão do cenário do jogo"
      />
    </footer>
  </body>
</html>
