<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="imagens/Favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Jersey+10&family=Oxanium:wght@200..800&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <title>Falkron — Coming Soon</title>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__container">
        <img class="site-header__logo" src="./imagens/Logo.png" alt="Falkron" />
      </div>
    </header>

    <main class="main-content">
      <section class="intro-section">
        <h1 class="intro-section__title">
          O FALKRON AINDA ESTÁ EM <span>DESENVOLVIMENTO</span>.
        </h1>
        <p class="intro-section__description">
          Estamos construindo uma plataforma para ajudar você a descobrir seu
          próximo jogo favorito.
        </p>
        <p class="intro-section__cta">Enquanto isso, teste seus reflexos em:</p>
        <h2 class="intro-section__game-name">//SCAPE PROTOCOL</h2>
      </section>

      <section class="initial-instructions">
        <h3 class="initial-instructions__text">
          <span>PRESSIONE QUALQUER TECLA PARA INICIAR</span>
        </h3>
      </section>
    </main>

    <footer class="footer">
      <img
        class="site-footer__character"
        src="./imagens/FalkronWaiting.png"
        alt="Personagem do jogo em pose inicial"
      />
      <img
        class="site-footer__ground"
        src="./imagens/Ground.png"
        alt="Chão do cenário do jogo"
      />
    </footer>
  </body>
</html>
